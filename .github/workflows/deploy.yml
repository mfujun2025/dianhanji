name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        env:
          # 站点已绑定自有域名 电焊机.cn（Pages Custom domain 已生效），
          # 内容挂在域名根目录，因此 base 必须为 "/"。
          #
          # ⚠️ 这里必须是 "/"，不能是 "/dianhanji/"：
          #   设为 "/dianhanji/" 时资源路径会变成 https://xn--nqv61tpnd.cn/dianhanji/assets/...
          #   而自定义域名下内容在根目录，该路径 404 → 页面只剩裸 HTML（无样式、无图标、表单失效）。
          #   仅当「未绑域名、走 mfujun2025.github.io/dianhanji/ 子路径」时才需要改成 "/dianhanji/"。
          DEPLOY_BASE: /
        run: |
          node _build-articles.mjs
          node _build.mjs
          node _gen-sitemap.mjs
          node _sync-dist.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库首次部署时 Pages 尚未启用，让 Action 自动开启（需 workflow 有 pages:write 权限）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
