name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        env:
          # GitHub Pages 子路径部署：资源与内链必须带 /dianhanji/ 前缀，否则线上 JS/CSS 全部 404。
          # 绑定自有域名（电焊机.cn）后可把此值改为 "/" 或删除该环境变量。
          DEPLOY_BASE: /dianhanji/
        run: |
          node _build-articles.mjs
          node _build.mjs
          node _gen-sitemap.mjs
          node _sync-dist.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库首次部署时 Pages 尚未启用，让 Action 自动开启（需 workflow 有 pages:write 权限）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
